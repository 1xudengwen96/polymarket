# 概率模型参数（docs/05-probability-engine.md）
model: logistic                     # Phase 2 起点：逻辑回归占位（后续 lightgbm）
model_version: v0
model_artifact: artifacts/logreg_v1.json   # 训练工件（模型系数+校准桶）；paper/live 启动时加载
min_bucket_n: 200                   # 校准桶最小样本
cold_start_shrink: 0.85             # 冷启动收缩因子
risk_buffer_global: 0.005
model_err_cold_start: 0.03          # 冷启动模型误差假设
time_risk_k: 0.002                  # 时间风险系数 (60/remaining)^0.5 × k
exec_risk_default: 0.003

features:
  ret_windows: [1, 3, 5, 10, 30, 60]
  rv_windows: [5, 30, 60]
  vol_windows: [1, 10, 60]
  flow_windows: [5, 30]
  obi_levels: [3, 10]
  book_top_n: 10
