[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm5hft"
version = "0.1.0"
description = "Polymarket Crypto 5-minute Up/Down high-frequency trading bot (paper-first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "numpy>=1.26",
    # Official unified SDK: used by the LIVE gateway (order signing/execution),
    # not required by the paper data plane.
    "polymarket-client>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
backtest = [
    "pandas>=2.2",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
]

[project.scripts]
pm5hft = "pm5hft.main:cli"

[tool.setuptools.packages.find]
include = ["pm5hft*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
